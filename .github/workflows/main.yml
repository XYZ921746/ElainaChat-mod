name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build || echo "没有找到 build 脚本，跳过打包"

      # 【核心修复 1】智能整理网页文件到 dist 目录
      - name: Prepare web assets (ensure dist/index.html exists)
        run: |
          mkdir -p dist
          # 如果您的打包输出到了 build 文件夹，复制过去
          if [ -d "build" ]; then
            echo "检测到 build 文件夹，复制内容到 dist..."
            cp -r build/* dist/
          fi
          
          # 如果 dist 里还没有 index.html，在仓库里全局寻找（排除 node_modules 和 android）
          if [ ! -f "dist/index.html" ]; then
            echo "dist 中未找到 index.html，正在全局搜索..."
            find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" -exec cp {} dist/ \;
            # 尝试复制常见的静态资源文件夹
            cp -r public/* dist/ 2>/dev/null || true
            cp -r css js assets images src 2>/dev/null || true
          fi
          
          # 再次检查，如果还没有，说明仓库真的没有网页文件，直接报错
          if [ ! -f "dist/index.html" ]; then
            echo "❌ 错误：无法在仓库中找到 index.html 文件，请检查您的项目结构！"
            exit 1
          fi
          echo "✅ Web 资源准备完毕："
          ls -la dist/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 【核心修复 2】清理之前运行失败残留的 android 目录
      - name: Clean previous Android folder
        run: rm -rf android

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap init "ElainaChat" "com.elaina.chat" --web-dir=dist
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
