name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build || echo "没有找到 build 脚本，跳过打包"

      # 【核心修复】如果不存在 dist 目录，强制创建并复制静态网页文件
      - name: Ensure dist directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "未找到 dist 目录，正在创建并复制静态资源..."
            mkdir -p dist
            # 尝试将常见的静态资源复制进 dist（容错处理，不存在则忽略）
            cp index.html dist/ 2>/dev/null || true
            cp -r css js assets src public build 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap init "ElainaChat" "com.elaina.chat" --web-dir=dist
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
