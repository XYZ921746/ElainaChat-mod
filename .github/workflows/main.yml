name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build || echo "No build script found, skipping build"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 移除原先有问题的 android-actions/setup-android@v3
      # 改为直接接受系统自带的 Android SDK 许可协议，确保 Gradle 能正常下载依赖
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found, initializing Capacitor..."
            npx cap init "ElainaChat" "com.elaina.chat" --web-dir=dist || true
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
