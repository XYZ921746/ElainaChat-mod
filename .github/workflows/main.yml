name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 很多个人项目仓库没有提交 package-lock.json，所以用 npm install 代替 npm ci
      - name: Install dependencies
        run: npm install

      # 打印 package.json 内容，方便在日志中排查项目配置
      - name: Debug package.json
        run: cat package.json

      # 尝试构建前端资源（如果 package.json 里没有 build 脚本，可以删掉这步）
      - name: Build web assets
        run: npm run build || echo "No build script found, skipping build"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 关键修复：如果仓库里没有 android 文件夹，自动初始化 Capacitor 并添加 Android 平台
      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found, initializing Capacitor..."
            npx cap init "ElainaChat" "com.elaina.chat" --web-dir=dist || true
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
