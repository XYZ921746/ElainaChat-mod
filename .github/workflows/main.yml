name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build || echo "没有找到 build 脚本，跳过打包"

      # 【关键修复】针对您的目录结构，直接从 web 文件夹复制到 dist
      - name: Prepare web assets (ensure dist/index.html exists)
        run: |
          mkdir -p dist
          # 如果项目里有 web 目录，直接复制里面的内容
          if [ -d "web" ]; then
            echo "检测到 web 文件夹，复制内容到 dist..."
            cp -r web/* dist/
          fi
          
          # 如果 dist 里还是没有 index.html，再全局搜一遍
          if [ ! -f "dist/index.html" ]; then
            echo "dist 中未找到 index.html，正在全局搜索..."
            find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" -exec cp {} dist/ \;
            cp -r public/* css js assets images src 2>/dev/null || true
          fi
          
          if [ ! -f "dist/index.html" ]; then
            echo "❌ 错误：无法在仓库中找到 index.html 文件！"
            exit 1
          fi
          echo "✅ Web 资源准备完毕："
          ls -la dist/

      # 【关键修复】升级到 Java 21，解决 "invalid source release: 21" 报错
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Clean previous Android folder
        run: rm -rf android

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap init "ElainaChat" "com.elaina.chat" --web-dir=dist
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
