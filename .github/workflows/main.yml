name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # 【关键修复】强制安装 Capacitor 相关依赖，解决 npx cap 命令找不到的问题
      - name: Install Capacitor Dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build || echo "No build script found, skipping build"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found, initializing Capacitor..."
            # 使用 npx cap 命令（此时 local node_modules 里已经有 cap 了）
            # 注意：--web-dir=dist 这个参数需要根据您的打包产物目录来定
            npx cap init "ElainaChat" "com.elaina.chat" --web-dir=dist
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
