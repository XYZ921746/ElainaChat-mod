name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: npm run build || echo "没有找到 build 脚本，跳过打包"

      - name: Prepare web assets (ensure dist/index.html exists)
        run: |
          mkdir -p dist
          if [ -d "web" ]; then
            echo "检测到 web 文件夹，复制内容到 dist..."
            cp -r web/* dist/
          fi
          if [ ! -f "dist/index.html" ]; then
            find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" -exec cp {} dist/ \;
            cp -r public/* css js assets images src 2>/dev/null || true
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ 错误：无法在仓库中找到 index.html 文件！"
            exit 1
          fi
          echo "✅ Web 资源准备完毕："
          ls -la dist/

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Clean previous Android folder
        run: rm -rf android

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap init "ElainaChat" "com.elaina.chat" --web-dir=dist
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # 【核心修复】强制统一 Kotlin 版本，解决 dependency resolution 报错
      - name: Fix Kotlin dependency conflicts
        run: |
          cd android
          cat << 'EOF' >> build.gradle
          
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  }
              }
          }
          EOF

      - name: Build Debug APK
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
